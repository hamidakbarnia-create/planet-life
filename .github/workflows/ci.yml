name: CI

on:
  push:
    branches:
      - main
      - governance-foundation
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Release gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - name: Web install
        working-directory: apps/web
        run: npm ci

      - name: API install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements-dev.txt

      - name: Web type-check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Web build
        working-directory: apps/web
        run: npm run build

      - name: Web lint
        working-directory: apps/web
        run: npm run lint

      - name: Web Vitest
        working-directory: apps/web
        run: npm run test

      - name: Decision engine tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest \
            packages/decision_engine/tests \
            -q \
            --disable-warnings \
            --maxfail=1

      - name: API pytest
        env:
          PYTHONPATH: apps/api/src:.
        run: |
          python -m pytest \
            apps/api/tests \
            -q \
            --disable-warnings \
            --maxfail=1
